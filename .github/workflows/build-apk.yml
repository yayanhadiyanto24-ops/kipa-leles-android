name: Build KIPA Leles APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract fixed Android project
        run: |
          test -f kipa-leles-android-project-fixed.zip || { echo 'ZIP perbaikan tidak ditemukan'; exit 1; }
          mkdir extracted
          unzip -q kipa-leles-android-project-fixed.zip -d extracted
          cp -a extracted/kipa-android/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KIPA-Leles-APK-Perbaikan
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
